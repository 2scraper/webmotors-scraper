name: Site changed / API broke
description: webmotors.com.br changed an endpoint and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth
        its own report because the fix is different from a code bug:
        something on webmotors.com.br moved.

        Useful to know before filing: this repo reads no HTML for its rows.
        Every row comes from the JSON endpoints the site's own front end
        calls (`product_parser.py` lists them), so a break is almost always a
        renamed field, a moved filter echo, a changed advert-link slug, or
        a change in what CloudFront or PerimeterX lets through.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - The run stops with "The API gateway refused this request"
        - 0 rows on a search that visibly has results on the site
        - A correct make or model is refused as "not recognised"
        - A specific column is null or wrong on every row
        - Ad mode reports adverts from a fresh search as gone
        - Every run is blocked (cloudfront or perimeterx), even from a residential exit
        - Pagination stops early or repeats rows
        - Something else
    validations:
      required: true

  - type: input
    id: query
    attributes:
      label: Mode and query
      description: The mode and flags (or --url), and the country your exit IP was in.
      placeholder: "--make volkswagen --model gol --pages 3 (exit: BR residential)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Whichever of these you can get. A capture beats a description.

        - The response as the parser saw it: re-run with
          `--dump-html response.json` and paste the first record (it is JSON).
        - For a column problem: the value you got, and the value the site shows.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
